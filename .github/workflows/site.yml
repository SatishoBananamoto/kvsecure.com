name: Site Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: node --check site.js
      - name: Check site claims and links
        run: python3 tools/check_site.py
